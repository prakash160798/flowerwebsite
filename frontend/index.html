<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Bouquet Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#333}
header{background:#d85b91;color:white;text-align:center;padding:32px 20px}
header h1{margin:0 0 8px;font-size:36px}
header p{margin:0;font-size:18px}
main{max-width:1100px;margin:30px auto;padding:0 20px}
h2{color:#b83f74}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.card h3{margin-top:0}
.price{font-size:22px;font-weight:bold;color:#b83f74}
button{border:0;border-radius:8px;padding:10px 16px;background:#d85b91;color:white;cursor:pointer}
button:hover{opacity:.9}
.cart{margin-top:35px;background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.item{padding:10px 0;border-bottom:1px solid #eee}
.message{font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<header>
<h1>🌸 Bloom Bouquet Shop</h1>
<p>Fresh flowers for every special occasion</p>
</header>

<main>
<section>
<h2>Our Bouquets</h2>
<div id="products" class="grid"><p>Loading products...</p></div>
</section>

<section class="cart">
<h2>🛒 Shopping Cart</h2>
<div id="cart"><p>Your cart is empty.</p></div>
<button id="orderBtn">Place Demo Order</button>
<p id="message" class="message"></p>
</section>
</main>

<script>
let cart=[];

async function loadProducts(){
    try{
        const response=await fetch('/api/products');
        const products=await response.json();
        const container=document.getElementById('products');
        container.innerHTML=products.map(product=>`
            <article class="card">
                <h3>💐 ${escapeHtml(product.name)}</h3>
                <p>${escapeHtml(product.description || '')}</p>
                <p class="price">₹${Number(product.price).toFixed(2)}</p>
                <p>Stock: ${product.stock}</p>
                <button onclick="addToCart(${product.id})">Add to Cart</button>
            </article>
        `).join('');
        window.products=products;
    }catch(error){
        document.getElementById('products').innerHTML='<p>Unable to load products.</p>';
    }
}

function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function addToCart(id){
    const product=window.products.find(p=>p.id===id);
    if(product) cart.push(product);
    renderCart();
}

function renderCart(){
    const container=document.getElementById('cart');
    if(!cart.length){
        container.innerHTML='<p>Your cart is empty.</p>';
        return;
    }
    container.innerHTML=cart.map((p,i)=>`
        <div class="item">
            ${escapeHtml(p.name)} — ₹${Number(p.price).toFixed(2)}
            <button onclick="removeFromCart(${i})">Remove</button>
        </div>
    `).join('');
}

function removeFromCart(index){
    cart.splice(index,1);
    renderCart();
}

document.getElementById('orderBtn').addEventListener('click',async()=>{
    const message=document.getElementById('message');
    if(!cart.length){
        message.textContent='Please add a bouquet first.';
        return;
    }

    const response=await fetch('/api/orders',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            customer:{
                name:'Demo Customer',
                email:'demo@example.com',
                phone:'0000000000',
                address:'Demo Address'
            },
            items:cart.map(p=>({product_id:p.id,quantity:1}))
        })
    });

    const data=await response.json();
    if(response.ok){
        message.textContent=`Order #${data.order_id} placed successfully!`;
        cart=[];
        renderCart();
        loadProducts();
    }else{
        message.textContent=data.error || 'Order failed.';
    }
});

loadProducts();
</script>
</body>
</html>
